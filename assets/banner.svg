<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#051329"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="purpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a18cd1"/><stop offset="100%" stop-color="#fbc2eb"/></linearGradient><linearGradient id="scanGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/><stop offset="50%" stop-color="#00f2fe" stop-opacity=".35"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes scanBeam{0%{transform:translateY(-40px);opacity:0}20%,80%{opacity:.8}}@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}.scanner-beam{animation:scanBeam 4s cubic-bezier(.4,0,.2,1) infinite}.pulsing-orb{animation:pulseGlow 3s ease-in-out infinite;transform-origin:center}.pipeline-flow{stroke-dasharray:6,6;animation:dashMove 1.5s linear infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400;letter-spacing:.2px}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="150" cy="120" r="140" fill="#00f2fe" class="pulsing-orb" filter="url(#glow)" opacity=".08"/><circle cx="1050" cy="300" r="180" fill="#4facfe" class="pulsing-orb" filter="url(#glow)" opacity=".07"/><g transform="translate(820, 50)"><rect width="310" height="320" x="0" y="0" fill="#0b1329" stroke="#1e293b" stroke-width="2" rx="20"/><circle cx="155" cy="160" r="115" fill="none" stroke="#1e293b" stroke-width="3"/><circle cx="155" cy="160" r="100" fill="#070c1a" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glow)" opacity=".6"/><circle cx="155" cy="160" r="70" fill="none" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5" class="pipeline-flow"/><line x1="155" x2="155" y1="90" y2="230" stroke="#00f2fe" stroke-opacity=".4" stroke-width="1"/><line x1="85" x2="225" y1="160" y2="160" stroke="#00f2fe" stroke-opacity=".4" stroke-width="1"/><circle cx="155" cy="160" r="32" fill="#00f2fe" fill-opacity=".12" stroke="#00f2fe" stroke-width="1.5"/><circle cx="155" cy="160" r="8" fill="#00f2fe" filter="url(#glow)"/><rect width="260" height="40" x="25" y="0" fill="url(#scanGrad)" class="scanner-beam"/><line x1="25" x2="285" y1="40" y2="40" stroke="#00f2fe" stroke-width="2" class="scanner-beam" filter="url(#glow)"/><text x="25" y="32" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">MODALITY: CT/MRI/XR</text><text x="25" y="296" fill="#38bdf8" font-family="monospace" font-size="11">AI SEGMENTATION: 99.4%</text><circle cx="280" cy="28" r="4" fill="#10b981"/></g><g transform="translate(80, 80)"><rect width="310" height="32" x="0" y="0" fill="#0f172a" stroke="#00f2fe" stroke-opacity=".4" stroke-width="1.5" rx="16"/><circle cx="18" cy="16" r="5" fill="#00f2fe" filter="url(#glow)"/><text x="32" y="21" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE &amp; OPEN-SOURCE AI</text><text x="0" y="85" fill="#fff" class="title-text" font-size="44">Awesome Radiology</text><text x="0" y="135" fill="url(#cyanGrad)" class="title-text" filter="url(#glow)" font-size="44">AI Platforms 🩻</text><text x="0" y="178" fill="#94a3b8" class="subtitle-text" font-size="16">Curated index of Medical Imaging AI, SaaS Diagnostic Systems,</text><text x="0" y="202" fill="#94a3b8" class="subtitle-text" font-size="16">PACS/DICOM Infrastructure, and Open-Source Segmentation Frameworks.</text><g transform="translate(0, 230)"><rect width="105" height="28" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="14" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚡ MONAI</text><rect width="115" height="28" x="115" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="127" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🎯 nnU-Net</text><rect width="155" height="28" x="240" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="252" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🩻 TotalSegmentator</text><rect width="95" height="28" x="405" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="419" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🖥️ OHIF</text><rect width="115" height="28" x="510" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="522" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🏥 Orthanc</text><rect width="115" height="28" x="635" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="647" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">☁️ Aidoc &amp; SaaS</text></g></g></svg>