<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <style>
      @keyframes scanBeam {
        0% { transform: translateY(-40px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .scanner-beam {
        animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pulsing-orb {
        animation: pulseGlow 3s ease-in-out infinite;
        transform-origin: center;
      }
      .pipeline-flow {
        stroke-dasharray: 6, 6;
        animation: dashMove 1.5s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1050" cy="300" r="180" fill="#4facfe" opacity="0.07" filter="url(#glow)" class="pulsing-orb" />

  <!-- Scanner Visual Container (Right Side) -->
  <g transform="translate(820, 50)">
    <!-- CT/MRI Scanner Gantry Outline -->
    <rect x="0" y="0" width="310" height="320" rx="20" fill="#0b1329" stroke="#1e293b" stroke-width="2" />
    <circle cx="155" cy="160" r="115" fill="none" stroke="#1e293b" stroke-width="3" />
    <circle cx="155" cy="160" r="100" fill="#070c1a" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glow)" opacity="0.6" />
    <circle cx="155" cy="160" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" class="pipeline-flow" />

    <!-- Medical Anatomy Crosshair / Target Area -->
    <line x1="155" y1="90" x2="155" y2="230" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" />
    <line x1="85" y1="160" x2="225" y2="160" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="155" cy="160" r="32" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="155" cy="160" r="8" fill="#00f2fe" filter="url(#glow)" />

    <!-- Animated Scanning Laser / Radiation Beam -->
    <rect x="25" y="0" width="260" height="40" fill="url(#scanGrad)" class="scanner-beam" />
    <line x1="25" y1="40" x2="285" y2="40" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" class="scanner-beam" />

    <!-- HUD Overlay Readouts -->
    <text x="25" y="32" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">MODALITY: CT/MRI/XR</text>
    <text x="25" y="296" fill="#38bdf8" font-family="monospace" font-size="11">AI SEGMENTATION: 99.4%</text>
    <circle cx="280" cy="28" r="4" fill="#10b981" />
  </g>

  <!-- Left Content / Typography -->
  <g transform="translate(80, 80)">
    <!-- Top Pill / Badge -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#00f2fe" filter="url(#glow)" />
    <text x="32" y="21" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE &amp; OPEN-SOURCE AI</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" class="title-text">
      Awesome Radiology
    </text>
    <text x="0" y="135" fill="url(#cyanGrad)" font-size="44" class="title-text" filter="url(#glow)">
      AI Platforms 🩻
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="178" fill="#94a3b8" font-size="16" class="subtitle-text">
      Curated index of Medical Imaging AI, SaaS Diagnostic Systems,
    </text>
    <text x="0" y="202" fill="#94a3b8" font-size="16" class="subtitle-text">
      PACS/DICOM Infrastructure, and Open-Source Segmentation Frameworks.
    </text>

    <!-- Capability Tags / Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="105" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚡ MONAI</text>

      <rect x="115" y="0" width="115" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="127" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🎯 nnU-Net</text>

      <rect x="240" y="0" width="155" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="252" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🩻 TotalSegmentator</text>

      <rect x="405" y="0" width="95" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="419" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🖥️ OHIF</text>

      <rect x="510" y="0" width="115" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="522" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🏥 Orthanc</text>

      <rect x="635" y="0" width="115" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="647" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">☁️ Aidoc &amp; SaaS</text>
    </g>
  </g>
</svg>